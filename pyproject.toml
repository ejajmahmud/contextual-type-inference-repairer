[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-type-inference-repairer"
version = "0.1.0"
description = "Abstract type reconstruction tool repairing broken TypeScript and Python type annotations during rapid agent code generation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
contextual-type-inference-repairer = "contextual_type_inference_repairer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextual_type_inference_repairer*"]
